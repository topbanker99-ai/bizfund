<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 영상면접 · 사장님서랍</title>
<meta name="description" content="업종별 6가지 질문으로 진행하는 알바 영상면접. 답변은 글로 옮겨져 사장님 현황판으로 전달됩니다.">
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{
 --navy:#0F2A4A; --blue:#1B6FD8; --blue-soft:#EAF2FC; --blue-line:#C5DAF6;
 --ink:#161C25; --sub:#56616E; --faint:#8B95A3;
 --bg:#F3F6F9; --paper:#FFFFFF; --line:#E2E7EE;
 --ok:#0E7A4D; --ok-bg:#E8F5EE; --warn:#9A6B00; --warn-bg:#FBF3DE; --warn-line:#EADFBF;
 --stop:#C0392B; --stop-bg:#FBEDEC;
 --shadow:0 6px 18px rgba(15,42,74,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-text-size-adjust:100%}
.app{min-height:100vh}
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:600px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:14.5px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--blue)}
.top-right{font-size:12px;color:var(--faint);font-weight:600}
.backpill{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:12.5px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding:22px 18px 60px}
.scr{display:none}.scr.on{display:block}
.eyebrow{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px}
h1.t{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.025em;line-height:1.35;margin:0}
p.d{font-size:14.5px;color:var(--sub);margin-top:10px}
.btn{display:block;width:100%;border-radius:12px;font-weight:800;font-size:16px;padding:16px;text-align:center;transition:.12s;border:none;font-family:inherit;cursor:pointer}
.btn.p{background:var(--blue);color:#fff}
.btn.p:disabled{background:#C4D4E7;cursor:not-allowed}
.btn.g{background:var(--paper);border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{font-size:14px;padding:12px}
.note{border-radius:12px;padding:13px 15px;font-size:13.5px;margin-top:12px}
.note.info{background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--navy)}
.note.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn)}
.note.stop{background:var(--stop-bg);border:1px solid #EECFCA;color:var(--stop)}
.foot{font-size:12px;color:var(--faint);margin-top:10px;text-align:center}
/* 업종 선택 */
.sets{display:grid;gap:10px;margin-top:6px}
.set{display:flex;align-items:flex-start;gap:13px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:15px;text-align:left;box-shadow:var(--shadow);width:100%;cursor:pointer;font-family:inherit}
.set.on{border-color:var(--blue);background:var(--blue-soft)}
.set-ic{width:52px;height:52px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain}
.set-tx{flex:1;min-width:0}
.set-tx b{display:block;font-size:15.5px;font-weight:800;color:var(--navy)}
.set-tx .jobs{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}
/* 면접 */
.itv-stage{background:linear-gradient(170deg,#EAF2FC,#F7FAFF);border:1px solid var(--blue-line);border-radius:18px;padding:14px;text-align:center}
.itv-face{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto;background:#fff;border:1px solid var(--blue-line);border-radius:20px;box-shadow:var(--shadow);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.itv-name{font-size:12px;font-weight:700;color:var(--sub);margin-top:6px}
.itv-bubble{background:#fff;border:1.5px solid var(--blue-line);border-radius:16px;padding:15px 16px;margin-top:12px;text-align:left;position:relative;box-shadow:var(--shadow)}
.itv-bubble:before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);width:15px;height:15px;background:#fff;border-left:1.5px solid var(--blue-line);border-top:1.5px solid var(--blue-line)}
.itv-cat{display:inline-block;font-size:10.5px;font-weight:800;background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:3px 9px;margin-bottom:7px}
.itv-q{font-size:16px;font-weight:800;color:var(--navy);line-height:1.45;letter-spacing:-.02em}
.itv-cam{width:100%;max-width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#0F2A4A;margin:12px auto 0;display:block;transform:scaleX(-1)}
.itv-phase{font-size:12.5px;font-weight:700;color:var(--sub);margin-top:10px}
.itv-phase b{color:var(--blue)}
.rec{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--stop);background:var(--stop-bg);border-radius:999px;padding:3px 10px;margin-top:8px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--stop);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.gbar .nm{font-size:15px;font-weight:800;color:var(--navy)}
.gbar .st{font-size:12.5px;color:var(--faint);font-weight:600}
.tbar{height:6px;background:#E6ECF3;border-radius:99px;overflow:hidden;margin-bottom:14px}
.tfill{height:100%;background:var(--blue);border-radius:99px}
/* 결과 */
.qa{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--paper)}
.qa .c{font-size:10.5px;font-weight:800;color:var(--faint)}
.qa .q{font-size:13.5px;font-weight:800;color:var(--navy);margin:3px 0 6px;line-height:1.45}
.qa .a{font-size:13.5px;color:var(--sub);line-height:1.6;white-space:pre-wrap}
.qa .a.empty{color:var(--faint)}
</style>
</head>
<body>

<div class="app">
<div class="top"><div class="top-in">
  <button class="backpill" id="backBtn" onclick="goHome()" style="display:none">← 처음</button>
  <div class="brand"><a href="./" style="text-decoration:none;color:inherit">사장님<em>서랍</em></a> · AI 영상면접</div>
  <div class="top-right" id="topRight"></div>
</div></div>

<div class="wrap">

<!-- 1. 업종 선택 -->
<section class="scr on" id="s-pick">
  <span class="eyebrow">영상면접</span>
  <h1 class="t">어떤 일자리의 면접인가요?</h1>
  <p class="d">업종을 고르면 그 일에 맞는 질문 6가지가 준비됩니다. 약 7분 정도 걸립니다.</p>
  <div class="sets" id="setList"></div>
  <div class="note warn" style="margin-top:16px">
    <b>이 면접만으로 채용을 결정하지 마세요.</b> 긴장 정도나 말솜씨가 답변에 영향을 줍니다.
    무엇을 더 물어볼지 정하는 참고 자료로 쓰시길 권합니다.
  </div>
</section>

<!-- 2. 안내 -->
<section class="scr" id="s-intro">
  <span class="eyebrow" id="itvEye">영상면접</span>
  <h1 class="t">면접관과 6가지 질문</h1>
  <div class="itv-stage" style="margin-top:14px">
    <img class="itv-face" id="face0" alt="면접관" onerror="this.style.display='none'">
    <div class="itv-name" id="name0"></div>
    <div class="itv-bubble"><div class="itv-q" id="hello"></div></div>
  </div>
  <div class="note info" id="guide"></div>
  <div class="note" id="privacy" style="background:var(--bg);border:1px solid var(--line);color:var(--sub)"></div>
  <button class="btn p" style="margin-top:4px" onclick="start(true)">마이크 켜고 시작</button>
  <button class="btn g" style="margin-top:9px" onclick="start(false)">녹음 없이 질문만 보기</button>
  <button class="btn g sm" style="margin-top:9px" onclick="go('pick')">← 업종 다시 고르기</button>
</section>

<!-- 3. 진행 -->
<section class="scr" id="s-run">
  <div class="gbar"><span class="nm" id="qNo">질문 1 / 6</span><span class="st" id="qSt"></span></div>
  <div class="tbar"><div class="tfill" id="fill" style="width:100%"></div></div>
  <div class="itv-stage">
    <img class="itv-face" id="face" alt="면접관" onerror="this.style.display='none'">
    <div class="itv-bubble">
      <span class="itv-cat" id="cat"></span>
      <div class="itv-q" id="q"></div>
    </div>
    <video class="itv-cam" id="cam" autoplay playsinline muted style="display:none"></video>
    <div class="itv-phase" id="phase"></div>
    <div id="recBox"></div>
  </div>
  <button class="btn p" style="margin-top:14px" id="nextBtn" onclick="nextQ()">다음 질문 →</button>
  <button class="btn g sm" style="margin-top:9px" onclick="finish(true)">면접 그만두기</button>
</section>

<!-- 4. 마무리 -->
<section class="scr" id="s-done">
  <span class="eyebrow">면접 종료</span>
  <h1 class="t">수고하셨습니다</h1>
  <p class="d" id="doneSub">답변을 정리했습니다.</p>
  <div class="note info" id="sendStat" style="display:none"></div>
  <div id="qaList" style="margin-top:14px"></div>
  <div class="note info" style="margin-top:14px">이어서 <b>공감능력 테스트</b>(약 3분)도 해보실 수 있어요. 표정을 보고 감정을 맞히는 짧은 테스트입니다.</div>
  <a class="btn p" id="toEmpathy" style="text-decoration:none;margin-top:8px" href="empathy.html">공감능력 테스트 하러 가기</a>
  <button class="btn g" style="margin-top:9px" onclick="copyAll()">답변 전체 복사</button>
  <button class="btn g sm" style="margin-top:9px" onclick="location.href=location.pathname">다시 면접 보기</button>
  <button class="btn g sm" style="margin-top:9px" onclick="location.href='./'">사장님서랍 홈으로</button>
</section>

</div>
</div>

<script>
/* ============================================================
   AI 영상면접 — 업종별 6문항
   · 질문마다 생각 10초 → 답변 60초. 답변은 마이크로 녹음해 글로 옮긴다.
   · 오디오는 서버에 저장하지 않고 전사 후 버린다. 텍스트만 현황판으로 전달.
   · ?set=food&board=..&who=..&co=.. 로 들어오면 사장님 현황판으로 자동 전달.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const rnd = n => Math.floor(Math.random()*n);

const SETS = {

  care: { name:'정밀·반복', jobs:'청소 · 미용 · 농업축산 · 제조', ic:'clean' },
  cafe: { name:'카페·바리스타', jobs:'카페 · 디저트 · 베이커리', ic:'americano' },

  edit: { name:'영상 편집', jobs:'유튜브 편집 · 릴스·쇼츠 · 촬영 편집', ic:'clapper' }

const CATS = ['직무 경험','직무 역량','근로 조건','연장 근무','협업 경험','돌발 상황'];
const FACES = ['itv1','itv2','itv3','itv4'];
const NAMES = ['김지현 매니저','박성호 점장','이수아 매니저','정대근 사장님'];
const Q = {

  '손님이 “음료가 너무 달다”며 다시 만들어 달라고 하십니다. 어떻게 하시겠어요?'],

  '희망 근무 요일·시간과 출근 가능한 시점을 말씀해 주세요.',
  '마감이나 민원이 몰릴 때 늦게까지 근무가 가능하신가요?',
  '다른 부서나 동료와 협조해서 일을 처리해 본 경험이 있다면 말씀해 주세요.',

const READY_MS = 10000, ANSWER_MS = 60000;

const S = { set:null, i:0, face:0, rec:false, board:'', who:'', company:'', answers:[] };
let timer=null, raf=null, stream=null, mr=null, chunks=[];

/* ---------- 화면 전환 ---------- */
function go(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  $('s-'+id).classList.add('on');
  const bb=$('backBtn'); if(bb) bb.style.display = (id==='pick') ? 'none' : 'inline-flex';
  window.scrollTo(0,0);
}
function goHome(){
  if((document.getElementById('s-run').classList.contains('on')) &&
     !confirm('진행 중인 면접을 그만두고 처음으로 돌아갈까요?')) return;
  stopAll(); location.href = location.pathname;
}

/* ---------- 업종 선택 ---------- */
function renderSets(){
  $('setList').innerHTML = Object.entries(SETS).map(([k,v])=>
    `<button class="set" onclick="pickSet('${k}')">
      <img class="set-ic" src="assets/hire/img/${v.ic}.svg" alt="" onerror="this.style.display='none'">
      <span class="set-tx"><b>${esc(v.name)}</b><span class="jobs">${esc(v.jobs)}</span></span>
    </button>`).join('');
}
function pickSet(k){ S.set=k; intro(); }

/* ---------- 안내 ---------- */
function intro(){
  S.face = rnd(FACES.length);
  const v = SETS[S.set];
  $('itvEye').textContent = v.name + ' 영상면접';
  $('face0').src = 'assets/hire/img/'+FACES[S.face]+'.svg'; $('face0').style.display='';
  $('name0').textContent = NAMES[S.face];
  $('hello').textContent = '안녕하세요. ' + (S.company ? S.company+' ' : '') + v.name + ' 면접을 도와드릴 ' + NAMES[S.face] + '입니다. 편하게 답변해 주세요.';
  $('guide').innerHTML = '질문은 <b>6개</b>입니다. 질문마다 <b>생각할 시간 10초</b> 뒤 <b>답변 60초</b>가 주어집니다. 준비되면 바로 다음 질문으로 넘어갈 수 있어요.';
  $('privacy').innerHTML = S.board
    ? '답변은 <b>글로 옮겨져 지원하신 곳의 사장님께 전달</b>되며 30일 후 자동 삭제됩니다. 목소리 녹음 파일은 저장하지 않습니다.'
    : '답변은 <b>글로 옮겨 이 화면에만</b> 보여드립니다. 목소리 녹음 파일은 저장하지 않습니다.';
  $('topRight').textContent = S.who ? S.who : '';
  const eb=$('toEmpathy');
  if(eb) eb.href = 'empathy.html' + (S.board ? '?board='+encodeURIComponent(S.board)
      + (S.who?'&who='+encodeURIComponent(S.who):'') + (S.company?'&co='+encodeURIComponent(S.company):'') : '');
  go('intro');
}

/* ---------- 시작 ---------- */
async function start(useMic){
  S.i = 0; S.answers = []; S.rec = !!useMic;
  if(useMic){
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user'}, audio:true });
    }catch(e){
      try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
      catch(e2){ stream=null; S.rec=false; alert('마이크를 쓸 수 없어 질문만 보여드립니다.'); }
    }
  }
  const cam = $('cam');
  if(stream && stream.getVideoTracks().length){ cam.srcObject = stream; cam.style.display=''; }
  else cam.style.display='none';
  $('face').src = 'assets/hire/img/'+FACES[S.face]+'.svg'; $('face').style.display='';
  go('run'); show();
}

/* ---------- 질문 진행 ---------- */
function show(){
  const qs = Q[S.set] || Q.food;
  if(S.i >= qs.length){ finish(false); return; }
  $('qNo').textContent = `질문 ${S.i+1} / ${qs.length}`;
  $('qSt').textContent = NAMES[S.face];
  $('cat').textContent = CATS[S.i] || '';
  $('q').textContent = qs[S.i];
  $('recBox').innerHTML = '';
  phase('ready');
}
function phase(kind){
  stopTimer();
  const ms = kind==='ready' ? READY_MS : ANSWER_MS;
  const label = kind==='ready' ? '생각할 시간' : '답변해 주세요';
  if(kind==='answer'){ startRec(); $('recBox').innerHTML = S.rec ? '<span class="rec"><i></i>녹음 중</span>' : ''; }
  const t0 = performance.now();
  const tick = () => {
    const left = Math.max(0, ms - (performance.now()-t0));
    $('fill').style.width = (left/ms*100)+'%';
    $('phase').innerHTML = `${label} · <b>${Math.ceil(left/1000)}초</b>`;
    if(left>0) raf = requestAnimationFrame(tick);
  };
  tick();
  timer = setTimeout(()=>{ if(kind==='ready') phase('answer'); else nextQ(); }, ms);
}
function stopTimer(){ clearTimeout(timer); cancelAnimationFrame(raf); timer=null; raf=null; }

/* ---------- 녹음 ---------- */
function pickMime(){
  const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  for(const m of c){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}
function startRec(){
  if(!S.rec || !stream) return;
  try{
    const audio = new MediaStream(stream.getAudioTracks());
    const mime = pickMime();
    mr = mime ? new MediaRecorder(audio,{mimeType:mime}) : new MediaRecorder(audio);
    chunks = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.start();
  }catch(e){ mr=null; }
}
function stopRec(){
  return new Promise(res=>{
    if(!mr || mr.state==='inactive'){ res(null); return; }
    mr.onstop = () => { res(new Blob(chunks, {type: mr.mimeType || 'audio/webm'})); mr=null; };
    try{ mr.stop(); }catch(e){ res(null); mr=null; }
  });
}
const b64 = blob => new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(String(r.result).split(',')[1]||''); r.readAsDataURL(blob); });

/* 답변 오디오 → 서버 전사 */
async function transcribe(blob){
  if(!blob || blob.size < 1200) return '';
  try{
    const audioB64 = await b64(blob);
    const r = await fetch('/api/hire-interview', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ audioB64, mime: blob.type || 'audio/webm' }) });
    const j = await r.json();
    return (j && j.ok && j.text) ? j.text : '';
  }catch(e){ return ''; }
}

async function nextQ(){
  stopTimer();
  const qs = Q[S.set] || Q.food;
  const q = qs[S.i];
  const blob = await stopRec();
  S.answers.push({ q, a:'', blob });
  S.i++;
  show();
}

/* ---------- 마무리: 전사 → (보드 있으면) 전달 ---------- */
async function finish(quit){
  stopTimer();
  const blob = await stopRec();
  if(blob && S.answers.length < (Q[S.set]||Q.food).length){
    const qs = Q[S.set] || Q.food;
    S.answers.push({ q: qs[S.i], a:'', blob });
  }
  stopCam();
  go('done');
  const qs = Q[S.set] || Q.food;
  $('doneSub').textContent = S.rec ? '답변을 글로 옮기는 중입니다…' : '오늘 받은 질문입니다.';
  render();
  if(S.rec){
    for(let i=0;i<S.answers.length;i++){
      S.answers[i].a = await transcribe(S.answers[i].blob);
      S.answers[i].blob = null;   // 오디오는 바로 버린다
      render();
    }
    $('doneSub').textContent = '답변을 글로 옮겼습니다. 녹음 파일은 저장하지 않았습니다.';
    if(S.board) sendBoard();
  }
}
function render(){
  const qs = Q[S.set] || Q.food;
  $('qaList').innerHTML = qs.map((q,i)=>{
    const it = S.answers[i];
    const a = it ? it.a : '';
    const body = !S.rec ? '<div class="a empty">(녹음 없이 진행)</div>'
      : (a ? `<div class="a">${esc(a)}</div>`
           : (it ? '<div class="a empty">옮기는 중이거나 답변이 인식되지 않았습니다.</div>'
                 : '<div class="a empty">진행하지 않음</div>'));
    return `<div class="qa"><div class="c">${i+1}. ${esc(CATS[i]||'')}</div><div class="q">${esc(q)}</div>${body}</div>`;
  }).join('');
}
function sendBoard(){
  const el = $('sendStat'); el.style.display=''; el.textContent = '사장님께 전달하는 중…';
  fetch('/api/hire-board', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ kind:'interview', board:S.board, who:S.who, set:S.set, company:S.company,
      answers: S.answers.map(x=>({ q:x.q, a:x.a })) }) })
   .then(r=>r.ok ? r.json() : Promise.reject())
   .then(()=>{ el.innerHTML = '<b style="color:var(--ok)">✓ 면접 답변이 사장님께 전달됐습니다.</b> 연락을 기다려 주세요.'; })
   .catch(()=>{ el.className='note stop'; el.textContent = '전달에 실패했습니다. 아래 “답변 전체 복사”로 사장님께 보내주세요.'; });
}
function copyAll(){
  const qs = Q[S.set] || Q.food;
  const txt = `[${S.company||''} ${SETS[S.set].name} 영상면접] ${S.who||''}\n\n`
    + qs.map((q,i)=>`${i+1}. ${q}\n→ ${(S.answers[i]&&S.answers[i].a)||'(답변 없음)'}`).join('\n\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
    .then(()=>alert('복사했습니다. 사장님께 보내주세요.'))
    .catch(()=>alert('복사가 안 됩니다. 화면의 답변을 길게 눌러 직접 복사해 주세요.'));
}

/* ---------- 정리 ---------- */
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } const c=$('cam'); if(c){ c.srcObject=null; c.style.display='none'; } }
function stopAll(){ stopTimer(); try{ if(mr && mr.state!=='inactive') mr.stop(); }catch(e){} mr=null; stopCam(); }
window.addEventListener('pagehide', stopAll);

/* ---------- 부팅 ---------- */
renderSets();
(()=>{ const p=new URLSearchParams(location.search);
  S.board = (p.get('board')||'').trim();
  S.who   = (p.get('who')||'').slice(0,20);
  S.company = (p.get('co')||'').slice(0,30);
  const s = p.get('set');
  if(s && SETS[s]){ S.set=s; intro(); }
})();
</script>
